# Проверки платформы: манифесты deploy/ валидны, скрипты проходят shellcheck.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Схемы k8s и CRD Argo (Application).
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          crds='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          {
            helm template deploy/apps
            echo '---'
            cat deploy/bootstrap/root-app.yaml
            for f in deploy/litellm/*.yaml deploy/langfuse/*.yaml; do echo '---'; cat "$f"; done
          } | kubeconform -strict -summary -schema-location default -schema-location "$crds"

      - name: shellcheck
        run: shellcheck -x scripts/*.sh
