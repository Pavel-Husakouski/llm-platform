# Общая Grafana платформы: источники Prometheus и ClickHouse заданы здесь (provisioning),
# дашборды проекты заливают по API токеном service account из make grafana-token, каждый в
# свою папку. Дашборды и токены живут в базе Grafana на PVC.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana-community.github.io/helm-charts
    chart: grafana
    targetRevision: {{ .Values.charts.grafana }}
    helm:
      # Секреты grafana-admin и grafana-clickhouse создаёт make secret.
      valuesObject:
        admin:
          existingSecret: grafana-admin
        # PVC ReadWriteOnce: второй под при RollingUpdate его не получит.
        deploymentStrategy:
          type: Recreate
        persistence:
          enabled: true
          size: 1Gi
          # Постоянный каталог хоста, переживает переустановку k3s (deploy/storage).
          storageClassName: platform
        testFramework:
          enabled: false
        service:
          type: NodePort
          port: 3000
          nodePort: 30030
        resources:
          requests: { cpu: 50m, memory: 128Mi }
          limits: { memory: 4Gi }
        plugins:
          - grafana-clickhouse-datasource@{{ .Values.charts.grafanaClickhouse }}
        # GRAFANA_RO_PASSWORD для источника ClickHouse, GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET для SSO
        envFromSecrets:
          - name: grafana-clickhouse
          - name: grafana-keycloak
        grafana.ini:
          server:
            # root_url снаружи: по нему Grafana строит redirect OIDC (login/generic_oauth).
            root_url: {{ .Values.grafanaUrl }}
          analytics:
            reporting_enabled: false
            check_for_updates: false
            check_for_plugin_updates: false
          users:
            allow_sign_up: false
          auth.generic_oauth:
            enabled: true
            name: Keycloak
            client_id: grafana
            client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
            scopes: openid email profile
            auth_url: {{ .Values.keycloakUrl }}/realms/platform/protocol/openid-connect/auth
            token_url: {{ .Values.keycloakUrl }}/realms/platform/protocol/openid-connect/token
            api_url: {{ .Values.keycloakUrl }}/realms/platform/protocol/openid-connect/userinfo
            role_attribute_path: contains(groups[*], 'admins') && 'Admin' || contains(groups[*], 'viewers') && 'Viewer' || 'Viewer'
            role_attribute_strict: true
        # uid источников — контракт для дашбордов тенантов, не менять.
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://prometheus-server.monitoring:9090
                isDefault: true
                editable: false
              - name: ClickHouse
                uid: clickhouse
                type: grafana-clickhouse-datasource
                editable: false
                jsonData:
                  host: clickhouse.platform
                  port: 8123
                  protocol: http
                  username: grafana_ro
                  defaultDatabase: layers
                  # clickhouse-go шлёт max_execution_time = таймаут + 5 с, а профиль grafana_ro
                  # разрешает не больше 30: таймаут 25.
                  queryTimeout: "25"
                secureJsonData:
                  password: $GRAFANA_RO_PASSWORD
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
