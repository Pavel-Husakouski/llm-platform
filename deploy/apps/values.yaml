# Откуда Argo CD берёт манифесты платформы. targetRevision подменяет make up (REVISION=ветка).
repoURL: https://github.com/Pavel-Husakouski/llm-platform.git
targetRevision: main

# Адрес Langfuse UI в браузере (NEXTAUTH_URL): вход работает только по нему. make root
# подставляет адрес для TARGET: http://<HOST>:30300 в k3s, http://localhost:13300 в kind.
langfuseURL: http://localhost:13300

# Адреса SSO снаружи: issuer Keycloak (OIDC) и root_url Grafana. В kind — localhost, в k3s их
# подставляет make root по TARGET (как langfuseURL).
keycloakUrl: http://localhost:14040
grafanaUrl: http://localhost:13030

# Dify (chart, namespace dify): базовый домен для поддоменов (console./api./app./files./
# trigger./enterprise.) — gateway Caddy роутит по Host-заголовку, поэтому нужен не один хост,
# а отдельные поддомены на один IP. В kind — localhost (console.localhost и т.д. резолвятся в
# 127.0.0.1), в k3s make root подставляет <HOST>.nip.io (как langfuseURL).
difyHost: localhost
difyPort: 14600
# Схема внешних URL Dify (https в k3s через edge, http в kind); make root подставляет по TARGET.
difyUseTLS: false

# Секреты Dify. Chart не умеет брать их из existingSecret (только литерал или
# ExternalSecret-оператор), поэтому make root подставляет настоящие значения из Secret
# dify/dify (создаёт make secret) в root-app valuesObject. Здесь — нерабочие заглушки:
# настоящих значений в git нет.
difySecretKey: CHANGE_ME
difyInnerApiKey: CHANGE_ME
difyPostgresPassword: CHANGE_ME
difyRedisPassword: CHANGE_ME

# Версии сторонних charts фиксированы: обновление — отдельный коммит. Langfuse обновлять
# осторожно: make tenant ходит во внутренний tRPC UI (см. SPEC.md).
charts:
  # appVersion v1.10.1: вместе с chart обновить ROLLOUTS_PLUGIN в Makefile (make tools).
  argoRollouts: 2.43.8
  prometheus: 29.40.0
  langfuse: 2.2.4
  # grafana-community/helm-charts: grafana/helm-charts больше не обновляется.
  grafana: 14.4.0
  # Плагин источника данных ClickHouse в Grafana.
  grafanaClickhouse: 4.23.4
  # Dify (langgenius/dify-helm).
  dify: 3.13.4
