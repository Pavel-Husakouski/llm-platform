# Внутрикластерный DNS для issuer Keycloak: поды (Grafana/LiteLLM/Langfuse/Argo CD валидируют
# OIDC-issuer) резолвят keycloak.llm.internal -> хост (nginx edge :80). Точечный hosts, а НЕ
# forward в dnsmasq: у подов в search-доменах есть llm.internal, и жадный wildcard dnsmasq
# (*.llm.internal) отвечал бы на foo.svc.cluster.local.llm.internal хост-IP, ломая сервис-DNS.
# Corefile k3s уже импортирует этот ConfigMap: import /etc/coredns/custom/*.server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  llm-internal.server: |
    llm.internal:53 {
        errors
        hosts {
            192.168.50.195 keycloak.llm.internal
        }
    }
