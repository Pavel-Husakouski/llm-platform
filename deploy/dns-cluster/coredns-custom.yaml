# Внутрикластерный DNS для *.llm.internal: поды (Grafana/LiteLLM/Langfuse/Argo CD валидируют
# OIDC-issuer https://keycloak.llm.internal) не видят dnsmasq из deploy/dns — тот на hostPort 53
# для LAN-клиентов. Здесь k3s CoreDNS получает зону llm.internal и форвардит её в тот же
# dnsmasq (hostPort 53 на узле 192.168.50.195, с подов доступен по IP узла). Corefile k3s уже
# импортирует этот ConfigMap: import /etc/coredns/custom/*.server (см. kube-system/coredns).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  llm-internal.server: |
    llm.internal:53 {
        errors
        forward . 192.168.50.195
    }
