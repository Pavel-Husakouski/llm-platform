# Единая точка входа (edge): nginx терминирует TLS по wildcard *.llm.internal (+ *.dify.llm.internal)
# и проксирует по Host-заголовку. hostPort 80/443 на узле k3s — NodePort не умеет 443. Сертификат —
# Secret edge-tls (make edge-tls, в git его нет). Фаза 2: пользовательские сервисы на поддоменах;
# Prometheus/ClickHouse/Embeddings остаются на NodePort (админ-доступ, не SSO).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app.kubernetes.io/name: edge
data:
  nginx.conf: |
    error_log /dev/stderr warn;
    pid /tmp/nginx.pid;

    events {}

    http {
      access_log /dev/stdout;

      # RAG-документы Dify и загрузки Langfuse бывают крупнее дефолтных 1m.
      client_max_body_size 100m;

      # websocket (редактор n8n, exec Argo CD, live Grafana, socket.io Dify): держим upgrade.
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      # Keycloak — issuer SSO остаётся на http (поды валидируют токены по нему без CA).
      server {
        listen 80;
        server_name keycloak.llm.internal;
        location / {
          proxy_pass http://keycloak.keycloak.svc.cluster.local:8080;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header X-Forwarded-Port  $server_port;
        }
      }

      # HTTP -> HTTPS, все остальные хосты.
      server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
      }

      # Неизвестный Host на 443: закрываем, а не отдаём первый попавшийся сервис.
      server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        return 444;
      }

      # --- n8n ---
      server {
        listen 443 ssl;
        server_name n8n.llm.internal;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://n8n.n8n.svc.cluster.local:5678;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      # --- Argo CD ---
      server {
        listen 443 ssl;
        server_name argocd.llm.internal;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://argocd-server.argocd.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      # --- Grafana ---
      server {
        listen 443 ssl;
        server_name grafana.llm.internal;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://grafana.monitoring.svc.cluster.local:3000;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      # --- Langfuse ---
      server {
        listen 443 ssl;
        server_name langfuse.llm.internal;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://langfuse-web.langfuse.svc.cluster.local:3000;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      # --- LiteLLM ---
      server {
        listen 443 ssl;
        server_name litellm.llm.internal;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://litellm.llm.svc.cluster.local:4000;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }

      # --- Dify (wildcard поддоменов; Caddy дальше сам роутит по Host) ---
      server {
        listen 443 ssl;
        server_name *.dify.llm.internal;
        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        location / {
          proxy_pass http://dify-gateway-svc.dify.svc.cluster.local:80;
          proxy_http_version 1.1;
          proxy_buffering off;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Host  $host;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
    spec:
      containers:
        - name: nginx
          # официальный образ: master-процесс под root биндит 80/443 внутри пода (hostPort).
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
            - name: https
              containerPort: 443
              hostPort: 443
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 15
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: tls
          secret:
            secretName: edge-tls
