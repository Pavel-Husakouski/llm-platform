# Companion-манифесты для chart dify (deploy/apps/templates/dify.yaml):
# 1. PVC для файлового хранилища (uploads, RAG-документы). Chart сам его НЕ создаёт —
#    деплойменты монтируют PVC с именем dify-backend-pvc. AccessModes ReadWriteOnce
#    достаточно: узлы один, api и worker живут на нём же.
# 2. NodePort на gateway: у chart gateway Service жёстко ClusterIP, наружу отдаём отдельным.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dify-backend-pvc
spec:
  storageClassName: platform
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dify-gateway-nodeport
  labels:
    app.kubernetes.io/name: dify-gateway
spec:
  # NodePort: UI на <HOST>:30600 в k3s, на localhost:14600 в kind (extraPortMappings)
  type: NodePort
  selector:
    app: dify-gateway
  ports:
    - name: http
      port: 80
      targetPort: 3080
      nodePort: 30600
