# Общий Postgres платформы: продуктовые БД тенантов. Namespace platform — общий data plane,
# рядом ClickHouse. Одна инстанция на всех: у vanilla Postgres нет квот CPU/памяти на базу,
# изоляция — REVOKE CONNECT от PUBLIC, CONNECTION LIMIT и statement_timeout на роль (ставит
# scripts/tenant.sh). Тяжёлому тенанту — отдельный CNPG-кластер в его namespace, платформу
# менять не нужно. LiteLLM-овский litellm-postgres — отдельный, другой жизненный цикл.
#
# pgvector в template1: каждая новая БД наследует расширение (Job postgres-init ниже, как
# clickhouse-databases у ClickHouse). Имя образа совпадает с pgvector/pgvector:pg17 из
# docker-compose соседнего проекта: дампы совместимы в обе стороны.
#
# Service — NodePort :30432 (в kind проброшен на localhost:15432): приложения тенантов
# вне кластера (npm run dev на хосте) ходят в БД напрямую, как ClickHouse наружу. В кластере
# адрес тот же: postgres.platform:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      nodePort: 30432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg17
          env:
            # Суперпользователь, пароль и БД по умолчанию — в Secret platform/postgres,
            # создаёт make secret (как у litellm-postgres в llm).
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_DB }
            # Каталог данных внутри тома: в корне тома lost+found мешает initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          # TCP вместо exec pg_isready: exec-проба — новый процесс через containerd.
          readinessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        # Постоянный каталог хоста, переживает переустановку k3s (deploy/storage).
        storageClassName: platform
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# pgvector в template1: каждая новая БД тенанта получает расширение при CREATE DATABASE.
# Заодно закрывает служебную БД postgres от тенантов: у PUBLIC туда CONNECT по умолчанию.
# Идемпотентен, существующее не трогает, запускается при каждой синхронизации. В psql нужен
# -h postgres: локального сервера в поде Job нет.
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-init
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: pgvector/pgvector:0.8.7-pg17
          command:
            - psql
            - -v
            - ON_ERROR_STOP=1
            - -h
            - postgres
            - -U
            - platform
            - -d
            - template1
            - -c
            - CREATE EXTENSION IF NOT EXISTS vector
            - -c
            - REVOKE CONNECT ON DATABASE postgres FROM PUBLIC
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
