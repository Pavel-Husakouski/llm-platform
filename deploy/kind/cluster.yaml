# kind-кластер платформы: одна нода, NodePort-сервисы проброшены на localhost.
# Порты задаются только при создании кластера, поэтому 13000–13009 → 30000–30009 заранее
# зарезервированы под API тенантов: тенант берёт свободную пару и ставит nodePort из 3000x.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: llm-platform
nodes:
  - role: control-plane
    extraPortMappings:
      # Argo CD UI
      - containerPort: 30080
        hostPort: 18080
        listenAddress: 127.0.0.1
      # Prometheus UI
      - containerPort: 30090
        hostPort: 19090
        listenAddress: 127.0.0.1
      # Langfuse UI (и tRPC для make tenant)
      - containerPort: 30300
        hostPort: 13300
        listenAddress: 127.0.0.1
      # LiteLLM UI и API (и admin API для make tenant)
      - containerPort: 30400
        hostPort: 14000
        listenAddress: 127.0.0.1
      # TEI-эмбеддинги (alias embed в LiteLLM)
      - containerPort: 30180
        hostPort: 18180
        listenAddress: 127.0.0.1
      # Grafana
      - containerPort: 30030
        hostPort: 13030
        listenAddress: 127.0.0.1
      # Общий ClickHouse: HTTP (play) и native-протокол
      - containerPort: 30123
        hostPort: 18123
        listenAddress: 127.0.0.1
      - containerPort: 30900
        hostPort: 19000
        listenAddress: 127.0.0.1
      # Резерв под API тенантов
      - containerPort: 30000
        hostPort: 13000
        listenAddress: 127.0.0.1
      - containerPort: 30001
        hostPort: 13001
        listenAddress: 127.0.0.1
      - containerPort: 30002
        hostPort: 13002
        listenAddress: 127.0.0.1
      - containerPort: 30003
        hostPort: 13003
        listenAddress: 127.0.0.1
      - containerPort: 30004
        hostPort: 13004
        listenAddress: 127.0.0.1
      - containerPort: 30005
        hostPort: 13005
        listenAddress: 127.0.0.1
      - containerPort: 30006
        hostPort: 13006
        listenAddress: 127.0.0.1
      - containerPort: 30007
        hostPort: 13007
        listenAddress: 127.0.0.1
      - containerPort: 30008
        hostPort: 13008
        listenAddress: 127.0.0.1
      - containerPort: 30009
        hostPort: 13009
        listenAddress: 127.0.0.1
