# Values для helm install argo-cd. Argo CD — единственное, что ставится не из git (make up).

dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    # Без TLS: стенд в домашней сети (k3s на хосте в LAN или kind на 127.0.0.1)
    server.insecure: true
  cm:
    # Адрес Argo CD снаружи (redirect OIDC) и SSO через Keycloak. Значения плейсхолдеров ниже
    # (url, issuer) подставляет make argocd по TARGET.
    url: ARGOCD_URL
    oidc.config: |
      name: Keycloak
      issuer: KEYCLOAK_URL/realms/platform
      clientID: argocd
      clientSecret: $oidc.Keycloak.clientSecret
      # groups — не scope в Keycloak (иначе invalid_scope): claim добавляет маппер клиента (make keycloak).
      requestedScopes: ["openid", "profile", "email"]
    # Health для Application: без него sync waves в app-of-apps не ждут готовности дочерних
    # приложений, и Rollout тенанта синхронизируется раньше, чем появятся CRD Argo Rollouts.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs

  rbac:
    # admins/viewers — группы Keycloak (claim groups из id_token), admin — встроенный локальный
    # админ Argo CD (остаётся как fallback, когда Keycloak недоступен).
    policy.csv: |
      g, admin, role:admin
      g, admins, role:admin
      g, viewers, role:readonly
    scopes: '[groups]'

server:
  service:
    type: ClusterIP
