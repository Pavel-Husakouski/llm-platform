# Общий ClickHouse платформы. В базе default — трейсы, observations и scores Langfuse, базы
# тенантов (layers) — рядом. Живёт в namespace langfuse, потому что там его PVC с данными
# Langfuse. Один узел без Keeper и operator: chart Langfuse ставит ClickHouse через ClickHouse
# operator с cert-manager, для стенда это три лишних компонента. Langfuse работает с ним как с
# внешним в режиме CLICKHOUSE_CLUSTER_ENABLED=false.
#
# Пользователи, права и квоты — в platform-users.xml ниже. Пароли — в Secret clickhouse-users
# (создаёт make secret), ключ = имя пользователя; в под они попадают как env
# CH_PASSWORD_<user>. Базы создаёт Job clickhouse-databases после каждого sync.
#
# Профиль ClickHouse под один узел стенда. По умолчанию ClickHouse пишет в system.* метрики
# раз в секунду, сэмплы профайлера, свой лог и историю merge: в простое это ~60–100m CPU и
# сотни merge в час, при том что данных Langfuse — сотни килобайт. Оставлен только query_log
# с TTL 1 день: его читает Langfuse worker. Остальной холостой фон: 16 потоков асинхронных
# вставок и асинхронный логгер, которые просыпаются 100 раз в секунду, задачи MergeTree на
# каждую таблицу раз в секунду, пул на 512 потоков, лог уровня trace. Merge при объёме стенда
# подождут, пулы репликации, Kafka и distributed-таблиц не нужны.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  labels:
    app.kubernetes.io/name: clickhouse
data:
  low-cpu.xml: |
    <clickhouse>
      <aggregated_zookeeper_log remove="1"/>
      <asynchronous_insert_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <background_schedule_pool_log remove="1"/>
      <backup_log remove="1"/>
      <blob_storage_log remove="1"/>
      <delta_lake_metadata_log remove="1"/>
      <error_log remove="1"/>
      <iceberg_metadata_log remove="1"/>
      <instrumentation_trace_log remove="1"/>
      <metric_log remove="1"/>
      <opentelemetry_span_log remove="1"/>
      <part_log remove="1"/>
      <processors_profile_log remove="1"/>
      <query_metric_log remove="1"/>
      <query_thread_log remove="1"/>
      <query_views_log remove="1"/>
      <text_log remove="1"/>
      <trace_log remove="1"/>
      <zookeeper_connection_log remove="1"/>
      <zookeeper_log remove="1"/>
      <query_log replace="1">
        <database>system</database>
        <table>query_log</table>
        <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + INTERVAL 1 DAY DELETE</engine>
        <flush_interval_milliseconds>7500</flush_interval_milliseconds>
      </query_log>
      <asynchronous_metrics_update_period_s>60</asynchronous_metrics_update_period_s>
      <background_schedule_pool_size>4</background_schedule_pool_size>
      <!-- Потоки очереди асинхронных вставок (ими пишет Langfuse) и асинхронного логгера
           просыпаются 100 раз в секунду даже без работы: 16 + 2 потока давали ~17m CPU. -->
      <async_insert_threads>2</async_insert_threads>
      <background_buffer_flush_schedule_pool_size>1</background_buffer_flush_schedule_pool_size>
      <background_message_broker_schedule_pool_size>1</background_message_broker_schedule_pool_size>
      <background_distributed_schedule_pool_size>1</background_distributed_schedule_pool_size>
      <background_fetches_pool_size>1</background_fetches_pool_size>
      <background_move_pool_size>1</background_move_pool_size>
      <memory_worker_period_ms>1000</memory_worker_period_ms>
      <logger>
        <level>warning</level>
        <async>false</async>
      </logger>
      <merge_tree>
        <merge_tree_clear_old_parts_interval_seconds>30</merge_tree_clear_old_parts_interval_seconds>
        <merge_tree_clear_old_temporary_directories_interval_seconds>600</merge_tree_clear_old_temporary_directories_interval_seconds>
        <merge_selecting_sleep_ms>30000</merge_selecting_sleep_ms>
      </merge_tree>
    </clickhouse>
  users-low-cpu.xml: |
    <clickhouse>
      <profiles>
        <default>
          <query_profiler_real_time_period_ns>0</query_profiler_real_time_period_ns>
          <query_profiler_cpu_time_period_ns>0</query_profiler_cpu_time_period_ns>
        </default>
      </profiles>
    </clickhouse>
  # Пользователи тенантов и Grafana. Новый пользователь: блок здесь, ключ в clickhouse-users
  # (scripts/platform-secrets.sh), база в Job clickhouse-databases, затем поднять
  # config/revision у StatefulSet: новая переменная окружения нужна в поде.
  platform-users.xml: |
    <clickhouse>
      <profiles>
        <!-- Только чтение для дашбордов. readonly=2: драйвер Grafana может передавать
             настройки запроса, но лимиты ниже const и не меняются (0 значил бы «без
             лимита»). -->
        <grafana_ro>
          <readonly>2</readonly>
          <max_memory_usage>1000000000</max_memory_usage>
          <max_execution_time>30</max_execution_time>
          <max_concurrent_queries_for_user>4</max_concurrent_queries_for_user>
          <constraints>
            <readonly><const/></readonly>
            <max_memory_usage><const/></max_memory_usage>
            <max_execution_time><const/></max_execution_time>
            <max_concurrent_queries_for_user><const/></max_concurrent_queries_for_user>
          </constraints>
        </grafana_ro>
      </profiles>
      <quotas>
        <!-- Потолок на час: дашборд с автообновлением раз в 10 с даёт ~360 запросов на панель. -->
        <grafana_ro>
          <interval>
            <duration>3600</duration>
            <queries>20000</queries>
            <errors>0</errors>
            <result_rows>0</result_rows>
            <read_rows>0</read_rows>
            <execution_time>3600</execution_time>
          </interval>
        </grafana_ro>
      </quotas>
      <users>
        <!-- Проект layers пишет свои таблицы. ALTER и DROP не выданы: миграции схемы — через
             администратора платформы. -->
        <layers_writer>
          <password from_env="CH_PASSWORD_layers_writer"/>
          <networks><ip>::/0</ip></networks>
          <profile>default</profile>
          <quota>default</quota>
          <grants>
            <query>GRANT CREATE TABLE, INSERT, SELECT ON layers.*</query>
          </grants>
        </layers_writer>
        <grafana_ro>
          <password from_env="CH_PASSWORD_grafana_ro"/>
          <networks><ip>::/0</ip></networks>
          <profile>grafana_ro</profile>
          <quota>grafana_ro</quota>
          <grants>
            <query>GRANT SELECT ON layers.*</query>
          </grants>
        </grafana_ro>
      </users>
    </clickhouse>
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  # NodePort: HTTP и play на :30123, clickhouse-client на :30900 (в kind localhost:18123, :19000).
  # В кластере — http://clickhouse.langfuse:8123.
  type: NodePort
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
      nodePort: 30123
    - name: native
      port: 9000
      targetPort: native
      nodePort: 30900
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
      annotations:
        # subPath не обновляется на лету: после правки clickhouse-config поднять revision.
        config/revision: "5"
    spec:
      securityContext:
        fsGroup: 101
      containers:
        - name: clickhouse
          # Версия как в chart Langfuse 2.2.4 (рекомендованная для Langfuse v4).
          image: clickhouse/clickhouse-server:26.8.36.3
          env:
            - name: CLICKHOUSE_USER
              value: clickhouse
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  # Секреты создаёт make secret, в git их нет.
                  name: langfuse-clickhouse-auth
                  key: password
          # Пароли пользователей из platform-users.xml: CH_PASSWORD_<user>.
          envFrom:
            - prefix: CH_PASSWORD_
              secretRef:
                name: clickhouse-users
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            # Файлами через subPath, а не каталогом: entrypoint образа пишет в users.d
            # пользователя из CLICKHOUSE_USER.
            - name: config
              mountPath: /etc/clickhouse-server/config.d/low-cpu.xml
              subPath: low-cpu.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.d/low-cpu.xml
              subPath: users-low-cpu.xml
            - name: config
              mountPath: /etc/clickhouse-server/users.d/platform-users.xml
              subPath: platform-users.xml
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
# Базы тенантов: CREATE DATABASE из XML-конфига не задать, поэтому Job после каждого sync.
# Идемпотентен, существующие базы не трогает.
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-databases
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create
          image: clickhouse/clickhouse-server:26.8.36.3
          command:
            - clickhouse-client
            - --host=clickhouse
            - --user=clickhouse
            - --query=CREATE DATABASE IF NOT EXISTS layers
          env:
            # clickhouse-client берёт пароль из CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-clickhouse-auth
                  key: password
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
