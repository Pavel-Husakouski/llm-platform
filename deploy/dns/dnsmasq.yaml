# Локальный DNS для LAN-клиентов: dnsmasq на hostPort 53 узла k3s (192.168.50.195).
# Резолвит *.llm.internal -> хост, остальное форвардит роутеру. Стоковая прошивка
# AsusWRT 5.0 не умеет wildcard-записи (JFFS custom scripts убрали), поэтому отдельный
# сервер. Роутер должен отдавать его как DNS: LAN -> DHCP Server -> DNS Server 1 = 192.168.50.195.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsmasq-config
data:
  dnsmasq.conf: |
    # Не читаем /etc/resolv.conf пода (там CoreDNS — возможна петля), апстрим задаём явно.
    no-resolv
    # Роутер LAN: резолвит имена DHCP-клиентов и форвардит в WAN DNS.
    server=192.168.50.1
    # Локальный wildcard платформы: сам домен и все поддомены -> хост k3s.
    address=/llm.internal/192.168.50.195
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmasq
  labels:
    app.kubernetes.io/name: dnsmasq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dnsmasq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dnsmasq
    spec:
      containers:
        - name: dnsmasq
          image: jpillora/dnsmasq:1.1
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
              hostPort: 53
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
              hostPort: 53
          volumeMounts:
            - name: config
              mountPath: /etc/dnsmasq.conf
              subPath: dnsmasq.conf
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: dnsmasq-config
