# Redis для кэша ответов LiteLLM (litellm_settings.cache в litellm.yaml). Кэш можно терять,
# поэтому без PVC; память ограничена, при переполнении вытесняется по LRU.
apiVersion: v1
kind: Service
metadata:
  name: litellm-redis
  labels:
    app.kubernetes.io/name: litellm-redis
spec:
  selector:
    app.kubernetes.io/name: litellm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-redis
  labels:
    app.kubernetes.io/name: litellm-redis
spec:
  # serviceName любой, не headless: под один, доступ через Service litellm-redis (как у postgres/embeddings).
  serviceName: litellm-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
