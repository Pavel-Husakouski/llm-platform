# LiteLLM Proxy: шлюз между тенантами и провайдером LLM. Тенант знает только alias модели и
# свой virtual key, ключ DeepSeek есть только здесь. Каждый вызов уходит трейсом в Langfuse
# (callback langfuse_otel): в проект тенанта, если у его ключа задан metadata.logging
# (make tenant), иначе в проект platform. Стоимость считается по model_info.
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels:
    app.kubernetes.io/name: litellm
data:
  config.yaml: |
    model_list:
      # Alias — то, что тенанты указывают в model: смена провайдера — правка только этого файла.
      # deepseek-flash и fast — одна модель (v4-flash): первый alias исторический (agent), второй
      # — для проекта layers. thinking задаёт поведение, цены одинаковые.
      - model_name: deepseek-flash
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
        model_info:
          input_cost_per_token: 0.00000014
          output_cost_per_token: 0.00000028
      - model_name: fast
        litellm_params:
          model: deepseek/deepseek-v4-flash
          api_key: os.environ/DEEPSEEK_API_KEY
          # Классификаторы и простые ответы: thinking выключен.
          thinking:
            type: disabled
        model_info:
          input_cost_per_token: 0.00000014
          output_cost_per_token: 0.00000028
      # Сложные многошаговые задачи с инструментами: thinking включён, усилие low.
      - model_name: smart
        litellm_params:
          model: deepseek/deepseek-v4-pro
          api_key: os.environ/DEEPSEEK_API_KEY
          thinking:
            type: enabled
          reasoning_effort: low
        model_info:
          input_cost_per_token: 0.00000174
          output_cost_per_token: 0.00000348
      # Локальные эмбеддинги (TEI, deploy/embeddings) под alias embed: OpenAI-совместимый
      # /v1/embeddings, api_key TEI не проверяет. Цены 0 — эмбеддинги локальные.
      - model_name: embed
        litellm_params:
          model: openai/intfloat/multilingual-e5-base
          api_base: http://embeddings.tei:80/v1
          api_key: sk-dummy
        model_info:
          mode: embedding
          input_cost_per_token: 0
          output_cost_per_token: 0
    router_settings:
      num_retries: 2
      # Если smart недоступен, запрос уходит на fast (как в проекте layers).
      fallbacks:
        - smart: [fast]
    litellm_settings:
      callbacks: ["langfuse_otel"]
      # Провайдеру уходят только параметры, которые он понимает (thinking, reasoning_effort
      # и т.п. у deepseek), остальное LiteLLM тихо отбрасывает.
      drop_params: true
      # Кэш ответов в Redis (deploy/litellm/redis.yaml): повторный запрос — из кэша, TTL 1 час.
      # Агент отключает его на запрос флагом cache_exact_enabled (cache: {no-cache: true}).
      cache: true
      cache_params:
        type: redis
        host: litellm-redis
        port: 6379
        ttl: 3600
        supported_call_types: [acompletion, completion]
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  # NodePort: UI на <HOST>:30400 в k3s, на localhost:14000 в kind (extraPortMappings)
  type: NodePort
  selector:
    app.kubernetes.io/name: litellm
  ports:
    - name: http
      port: 4000
      targetPort: http
      nodePort: 30400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  labels:
    app.kubernetes.io/name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
      annotations:
        # subPath не обновляется на лету: после правки config.yaml поднять revision, чтобы
        # Deployment перезапустил под.
        config/revision: "5"
    spec:
      # Без БД LiteLLM падает на миграциях и уходит в CrashLoopBackOff: ждём Postgres заранее.
      initContainers:
        - name: wait-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h litellm-postgres -p 5432 -U litellm; do sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.109.1
          args: ["--config", "/app/config.yaml", "--port", "4000"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  # Секреты создаёт make secret, в git их нет.
                  name: deepseek
                  key: DEEPSEEK_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: LITELLM_MASTER_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgresql://litellm:$(POSTGRES_PASSWORD)@litellm-postgres:5432/litellm
            - name: LANGFUSE_HOST
              value: http://langfuse-web.langfuse:3000
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-api
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-api
                  key: LANGFUSE_SECRET_KEY
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          # Старт с миграциями БД занимает до минуты.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # readiness проверяет и БД: без неё ключи не проверить.
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: litellm-config
