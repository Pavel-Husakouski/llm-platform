# Эмбеддинги платформы: TEI (text-embeddings-inference) с intfloat/multilingual-e5-base,
# один под на всех. LiteLLM отдаёт их тенантам под alias embed, локальный litellm (docker)
# ходит через NodePort http://<HOST>:30180. Модель качается в /data один раз: PVC на
# StorageClass platform переживает переустановку k3s. Первый старт с загрузкой модели — до
# получаса, отсюда длинный startupProbe (в compose соседнего проекта был start_period 1800s).
# StatefulSet с именем модели, как соседи-стейтфулы (postgres-0, clickhouse-0): под —
# embeddings-multilingual-e5-base-0.
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  labels:
    app.kubernetes.io/name: embeddings
spec:
  # NodePort — для litellm вне кластера; внутри кластера http://embeddings:80 (namespace llm).
  type: NodePort
  selector:
    app.kubernetes.io/name: embeddings
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30180
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embeddings-data
  labels:
    app.kubernetes.io/name: embeddings
spec:
  storageClassName: platform
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: embeddings-multilingual-e5-base
  labels:
    app.kubernetes.io/name: embeddings
spec:
  # serviceName любой, не headless: под один, доступ через Service embeddings (как у postgres).
  serviceName: embeddings
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: embeddings
  template:
    metadata:
      labels:
        app.kubernetes.io/name: embeddings
    spec:
      containers:
        - name: embeddings
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
          # Аргументы один в один как в docker compose соседнего проекта.
          args:
            - --model-id
            - intfloat/multilingual-e5-base
            - --tokenization-workers
            - "2"
            - --port
            - "80"
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          # /health отвечает 200, только когда модель загружена (пока качается — 503), поэтому
          # он и в startup, и в readiness (/ready в TEI 1.9 нет — 404). Окно 30 мин — первый
          # старт с загрузкой модели, дальше под стартует за секунды.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              # onnxruntime раздаёт арену памяти потокам по числу ядер хоста (14): 2Gi — OOMKilled.
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: embeddings-data
